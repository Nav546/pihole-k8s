apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unbound-allow-pihole-only
spec:
  podSelector:
    matchLabels:
      app: unbound
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: pihole
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
